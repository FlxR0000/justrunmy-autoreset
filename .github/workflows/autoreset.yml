name: Auto Reset Timer

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  reset-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies Quickly
        run: |
          npm init -y
          npm install puppeteer-core puppeteer-extra puppeteer-extra-plugin-stealth
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Run Auto Reset Script
        env:
          MY_COOKIE: ${{ secrets.MY_COOKIE }}
        run: node autoreset.js

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-screenshot
          path: page_preview.png
